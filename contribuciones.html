<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contribuciones & Proyectos | Lotus O.o</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="Styles/Variables.css">
    <link rel="stylesheet" href="Styles/Reset.css">
    <link rel="stylesheet" href="Styles/Layout.css">
    <link rel="stylesheet" href="Styles/Utilities.css">
    <link rel="stylesheet" href="Styles/Proyectos.css">
</head>
<body>
    <header class="projects-header">
        <div class="container">
            <nav class="nav-bar">
                <a href="index.html" class="nav-back">&larr; Volver al Inicio</a>
                <h1 class="nav-brand">Lotus O.o</h1>
            </nav>
            <div class="hero-section">
                <h2 class="hero-title">Proyectos & Contribuciones</h2>
                <p class="hero-subtitle">Registro de modulos, herramientas y colaboraciones de desarrollo</p>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="projects-wrapper">
            <div id="projects-grid" class="projects-grid"></div>
        </section>
    </main>

    <template id="project-card-template">
        <article class="project-card">
            <div class="project-header">
                <span class="project-id"></span>
                <span class="project-tag"></span>
            </div>
            <h3 class="project-title"></h3>
            <p class="project-description"></p>
            <div class="project-footer">
                <span class="project-role"></span>
                <a class="project-link" target="_blank" rel="noopener noreferrer">Ver Repo</a>
            </div>
        </article>
    </template>

    <script src="Modules/Proyectos/proyectos.js" defer></script>
</body>
</html>
